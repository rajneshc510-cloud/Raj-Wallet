<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>RajWallet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: #f4f7fb;
      padding-bottom: 90px;
    }

    .top {
      background: #2563eb;
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    .top h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .top p {
      opacity: .9;
      font-size: 14px;
    }

    .balance {
      margin: 18px;
      padding: 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .balance-title {
      color: #667085;
      font-size: 14px;
    }

    .coins {
      font-size: 32px;
      font-weight: bold;
      margin: 8px 0;
    }

    .rupees {
      color: #667085;
      font-size: 14px;
    }

    .content {
      padding: 0 18px;
    }

    .content h2 {
      font-size: 20px;
      margin: 20px 0 12px;
    }

    .task {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .task h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .task p {
      font-size: 13px;
      color: #667085;
    }

    .task button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .task button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .withdraw {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 15px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 100%);
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      border-top: 1px solid #e5e7eb;
    }

    .nav button {
      background: none;
      border: none;
      font-size: 12px;
      color: #667085;
      cursor: pointer;
    }

    .nav button span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>RajWallet</h1>
    <p>Earn rewards by completing eligible tasks</p>
  </div>

  <div class="balance">
    <div class="balance-title">My Balance</div>
    <div class="coins">🪙 <span id="coins">0</span></div>
    <div class="rupees">Current balance: ₹<span id="rupees">0.00</span></div>
  </div>

  <div class="content">

    <h2>Available Tasks</h2>

    <div class="task">
      <div>
        <h3>Daily Check-in</h3>
        <p>Check in once every day</p>
      </div>
      <button onclick="completeTask(this,100)">Earn</button>
    </div>

    <div class="task">
      <div>
        <h3>Daily Bonus</h3>
        <p>Claim your available bonus</p>
      </div>
      <button onclick="completeTask(this,50)">Earn</button>
    </div>

    <div class="task">
      <div>
        <h3>Complete Task</h3>
        <p>Eligible task will appear here</p>
      </div>
      <button onclick="completeTask(this,25)">Earn</button>
    </div>

    <h2>Wallet</h2>

    <button class="withdraw" onclick="withdraw()">
      💰 Request Withdrawal
    </button>

  </div>

  <div class="nav">
    <button>
      <span>🏠</span>
      Home
    </button>

    <button>
      <span>🎯</span>
      Tasks
    </button>

    <button>
      <span>💰</span>
      Wallet
    </button>

    <button>
      <span>👤</span>
      Profile
    </button>
  </div>

</div>

<script>
  let coins = 0;

  function updateBalance() {
    document.getElementById("coins").textContent = coins;
    document.getElementById("rupees").textContent =
      (coins / 100).toFixed(2);
  }

  function completeTask(button, reward) {
    coins += reward;
    updateBalance();

    button.textContent = "Done";
    button.disabled = true;

    alert("Task completed. " + reward + " coins added.");
  }

  function withdraw() {
    if (coins < 1000) {
      alert("Minimum withdrawal requirement is 1000 coins.");
      return;
    }

    alert("Withdrawal request will be processed after verification.");
  }

  updateBalance();
</script>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zfamlavqfbvwjcjzyyqm.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FLtdHaZ_ukZNXF6e_XZy6g_papQqQ1z";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>
<script>
const authBox = document.createElement("div");

authBox.innerHTML = `
<div style="
position:fixed;inset:0;background:#07111f;z-index:99999;
display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="
  width:100%;max-width:380px;background:#101d2f;
  padding:25px;border-radius:20px;color:white;text-align:center;">
    
    <h2 style="margin-bottom:8px;">RajWallet</h2>
    <p style="color:#9fb0c5;">Login या नया account बनाएं</p>

    <input id="authEmail" type="email" placeholder="Email"
      style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:0;box-sizing:border-box;">

    <input id="authPassword" type="password" placeholder="Password"
      style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:0;box-sizing:border-box;">

    <button onclick="loginUser()" style="
      width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;
      background:#1683ff;color:white;font-weight:bold;">
      Login
    </button>

    <button onclick="signupUser()" style="
      width:100%;padding:13px;margin-top:10px;border:1px solid #1683ff;
      border-radius:10px;background:transparent;color:white;font-weight:bold;">
      Create Account
    </button>
<button onclick="googleLogin()" style="width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#4285F4;color:white;cursor:pointer;">
  Continue with Google
</button>
    <p id="authMessage" style="font-size:13px;margin-top:15px;"></p>
  </div>
</div>
`;

document.body.appendChild(authBox);

async function loginUser() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const msg = document.getElementById("authMessage");

  if (!email || !password) {
    msg.textContent = "Email और password डालें।";
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    msg.textContent = error.message;
    return;
  }

  authBox.remove();
}

async function signupUser() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const msg = document.getElementById("authMessage");

  if (!email || !password) {
    msg.textContent = "Email और password डालें।";
    return;
  }

  if (password.length < 6) {
    msg.textContent = "Password कम से कम 6 characters का होना चाहिए।";
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    msg.textContent = error.message;
    return;
  }

  msg.textContent = "Account बन गया। अगर email confirmation मांगे तो email verify करें।";
}
async function googleLogin() {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://rajneshc510-cloud.github.io/Raj-Wallet/"
    }
  });

  if (error) {
    document.getElementById("authMessage").textContent = error.message;
  }
}
</script>
<style>
  #authBoxFix,
  #authBoxFix * {
    pointer-events: auto !important;
  }

  #authBoxFix {
    z-index: 999999 !important;
  }

  #authBoxFix button {
    cursor: pointer !important;
  }
</style>

<script>
document.querySelectorAll('button').forEach(function(button) {
  button.style.pointerEvents = 'auto';
  button.style.cursor = 'pointer';
});
</script>
</body>
</html>
